name: Trigger Announcement Notifications Cron

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call App Announcement Notify API
        run: |
          curl -fsS "https://bojoiduty.vercel.app/api/line/announcement-notify?cron=true"
